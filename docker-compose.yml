name: oswfm
services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  eurekaserver:
    image: eurekaserver:latest
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      - SPRING_APPLICATION_NAME=eurekaserver
      - EUREKA_INSTANCE_HOSTNAME=eurekaserver
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - SERVER_PORT=8761
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=eurekaserver -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    networks:
      - opensourceworkforcemanagement

  db:
    image: postgis/postgis:latest
    container_name: opensourceworkforcemanagementdb
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=oswfm
      - POSTGRES_DB=opensourceworkforcemanagement
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./init_opensourceworkforcemanagementdb.sql:/docker-entrypoint-initdb.d/02-init_opensourceworkforcemanagementdb.sql
    networks:
      - opensourceworkforcemanagement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    ports:
      - "9095:9095"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9095
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - opensourceworkforcemanagement

  # ── Gateway ─────────────────────────────────────────────────────────────────

  apigateway:
    image: apigateway:latest
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    ports:
      - "1110:1110"
    environment:
      - SPRING_APPLICATION_NAME=apigateway
      - EUREKA_SERVICE_URL=http://eurekaserver:8761/eureka/
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=apigateway -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      - eurekaserver
    networks:
      - opensourceworkforcemanagement

  # ── Core Services ────────────────────────────────────────────────────────────

  authservice:
    image: authservice:latest
    build:
      context: .
      dockerfile: authservice/Dockerfile
    ports:
      - "1112:1112"
    environment:
      - SERVER_PORT=1112
      - SPRING_APPLICATION_NAME=authservice
      - EUREKA_SERVICE_URL=http://eurekaserver:8761/eureka/
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=authservice -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      - eurekaserver
    networks:
      - opensourceworkforcemanagement

  userservice:
    image: userservice:latest
    build:
      context: .
      dockerfile: userservice/Dockerfile
    ports:
      - "1113:1113"
    environment:
      - SERVER_PORT=1113
      - SPRING_APPLICATION_NAME=userservice
      - EUREKA_SERVICE_URL=http://eurekaserver:8761/eureka/
      - SECURITY_DB_IP=db
      - SECURITY_DB_PORT=5432
      - spring.datasource.url=jdbc:postgresql://db:5432/opensourceworkforcemanagement
      - spring.datasource.username=${DATABASE_USERNAME}
      - spring.datasource.password=${DATABASE_PASSWORD}
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=userservice -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      eurekaserver:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1113/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opensourceworkforcemanagement

  timesheetservice:
    image: timesheetservice:latest
    build:
      context: .
      dockerfile: timesheetservice/Dockerfile
    ports:
      - "1114:1114"
    environment:
      - SERVER_PORT=1114
      - SPRING_APPLICATION_NAME=timesheetservice
      - EUREKA_SERVICE_URL=http://eurekaserver:8761/eureka/
      - SECURITY_DB_IP=db
      - SECURITY_DB_PORT=5432
      - spring.datasource.url=jdbc:postgresql://db:5432/opensourceworkforcemanagement
      - spring.datasource.username=${DATABASE_USERNAME}
      - spring.datasource.password=${DATABASE_PASSWORD}
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=timesheetservice -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      eurekaserver:
        condition: service_started
      db:
        condition: service_healthy
      userservice:
        condition: service_healthy
    networks:
      - opensourceworkforcemanagement

  administrationservice:
    image: administrationservice:latest
    build:
      context: .
      dockerfile: administrationservice/Dockerfile
    ports:
      - "1115:1115"
    environment:
      - SERVER_PORT=1115
      - SPRING_APPLICATION_NAME=administrationservice
      - EUREKA_SERVICE_URL=http://eurekaserver:8761/eureka/
      - SECURITY_DB_IP=db
      - SECURITY_DB_PORT=5432
      - spring.datasource.url=jdbc:postgresql://db:5432/opensourceworkforcemanagement
      - spring.datasource.username=${DATABASE_USERNAME}
      - spring.datasource.password=${DATABASE_PASSWORD}
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=administrationservice -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      eurekaserver:
        condition: service_started
      db:
        condition: service_healthy
      userservice:
        condition: service_healthy
    networks:
      - opensourceworkforcemanagement

  # ── Kafka-dependent Services ─────────────────────────────────────────────────

  kafkaservice:
    image: kafkaservice:latest
    build:
      context: .
      dockerfile: kafkaservice/Dockerfile
    ports:
      - "1120:1120"
    environment:
      - SERVER_PORT=1120
      - SPRING_APPLICATION_NAME=kafkaservice
      - EUREKA_SERVICE_URL=http://eurekaserver:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=kafkaservice -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      eurekaserver:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - opensourceworkforcemanagement

  gisservice:
    image: gisservice:latest
    build:
      context: .
      dockerfile: gisservice/Dockerfile
    ports:
      - "1116:1116"
    environment:
      - SERVER_PORT=1116
      - SPRING_APPLICATION_NAME=gisservice
      - EUREKA_SERVICE_URL=http://eurekaserver:8761/eureka/
      - GIS_DB_IP=db
      - GIS_DB_PORT=5432
      - spring.datasource.url=jdbc:postgresql://db:5432/opensourceworkforcemanagement
      - spring.datasource.username=${DATABASE_USERNAME}
      - spring.datasource.password=${DATABASE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=gisservice -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      eurekaserver:
        condition: service_started
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
      userservice:
        condition: service_healthy
    networks:
      - opensourceworkforcemanagement

  notificationservice:
    image: notificationservice:latest
    build:
      context: .
      dockerfile: notificationservice/Dockerfile
    ports:
      - "1130:1130"
    environment:
      - SERVER_PORT=1130
      - SPRING_APPLICATION_NAME=notificationservice
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Mount your Firebase service account JSON and set the path below:
      # - FIREBASE_CREDENTIALS_PATH=/app/firebase-service-account.json
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=notificationservice -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - opensourceworkforcemanagement

  # ── Standalone Services ───────────────────────────────────────────────────────

  signalingservice:
    image: signalingservice:latest
    build:
      context: ./signalingservice
      dockerfile: Dockerfile
    ports:
      - "1122:1122"
    environment:
      - SERVER_PORT=1122
      - SPRING_APPLICATION_NAME=signalingservice
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.service.name=signalingservice -Dotel.exporter.otlp.endpoint=http://otel-collector:4317 -Dotel.exporter.otlp.protocol=grpc -Dotel.metrics.exporter=none -Dotel.logs.exporter=none
    volumes:
      - ./apigateway/target/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
    networks:
      - opensourceworkforcemanagement


networks:
  opensourceworkforcemanagement:
    name: opensourceworkforcemanagement
    driver: bridge

volumes:
  pgdata:
    name: pgdata
