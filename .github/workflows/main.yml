name: Security Scans (SonarQube + Semgrep + Trivy + KICS)

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:

  sonarqube:
    name: SonarQube Scan (temporary server)
    runs-on: ubuntu-latest
    env:
      SONAR_URL: http://localhost:9000
      SONAR_PROJECT_KEY: oswfm-backend
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'development' }}
          fetch-depth: 0   # full history gives Sonar accurate blame data

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for SonarQube to start
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s "$SONAR_URL/api/system/status" | jq -r '.status // empty' || true)
            echo "SonarQube status: ${status:-starting}"
            [ "$status" = "UP" ] && exit 0
            sleep 5
          done
          echo "::error::SonarQube did not start within 5 minutes"
          exit 1

      - name: Create analysis token
        run: |
          # The server is private to this job; replace the default admin password anyway.
          NEW_PW="Ci-$(openssl rand -hex 12)-Aa1!"
          echo "::add-mask::$NEW_PW"
          if curl -sf -u admin:admin -X POST "$SONAR_URL/api/users/change_password" \
               --data-urlencode "login=admin" \
               --data-urlencode "previousPassword=admin" \
               --data-urlencode "password=$NEW_PW"; then
            ADMIN_PW="$NEW_PW"
          else
            ADMIN_PW="admin"
          fi
          TOKEN=$(curl -sf -u "admin:$ADMIN_PW" -X POST "$SONAR_URL/api/user_tokens/generate" \
                    --data-urlencode "name=ci-${{ github.run_id }}" | jq -r '.token')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::Could not create SonarQube token"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Java analysis needs compiled classes, so build with Maven and run the
      # Sonar Maven plugin across all reactor modules.
      - name: Build and analyze
        run: >
          mvn -B -ntp verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -DskipTests
          -Dsonar.host.url=$SONAR_URL
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.projectKey=$SONAR_PROJECT_KEY
          -Dsonar.projectName=oswfm-microservice-backend
          -Dsonar.sourceEncoding=UTF-8

      - name: Wait for SonarQube to process the report
        run: |
          TASK_ID=$(grep '^ceTaskId=' target/sonar/report-task.txt | cut -d= -f2)
          echo "Background task: $TASK_ID"
          for i in $(seq 1 120); do
            status=$(curl -sf -u "$SONAR_TOKEN:" "$SONAR_URL/api/ce/task?id=$TASK_ID" | jq -r '.task.status')
            echo "Processing status: $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CANCELED) echo "::error::SonarQube processing $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::SonarQube processing timed out"
          exit 1

      - name: Print findings
        run: |
          mkdir -p sonar-results
          auth=(-sf -u "$SONAR_TOKEN:")

          # All open issues (paged, 500 per page, Sonar caps at 10,000)
          echo '[]' > sonar-results/issues.json
          p=1
          while :; do
            r=$(curl "${auth[@]}" "$SONAR_URL/api/issues/search?components=$SONAR_PROJECT_KEY&resolved=false&ps=500&p=$p")
            jq -s '.[0] + .[1].issues' sonar-results/issues.json <(echo "$r") > tmp.json && mv tmp.json sonar-results/issues.json
            total=$(echo "$r" | jq '.paging.total')
            [ $((p * 500)) -ge "$total" ] || [ "$p" -ge 20 ] && break
            p=$((p + 1))
          done

          curl "${auth[@]}" "$SONAR_URL/api/hotspots/search?project=$SONAR_PROJECT_KEY&ps=500" \
            | jq '.hotspots' > sonar-results/hotspots.json
          curl "${auth[@]}" "$SONAR_URL/api/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=ncloc,bugs,vulnerabilities,code_smells,security_hotspots,duplicated_lines_density" \
            > sonar-results/measures.json
          curl "${auth[@]}" "$SONAR_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY" \
            > sonar-results/quality-gate.json

          GATE=$(jq -r '.projectStatus.status' sonar-results/quality-gate.json)
          ISSUES=$(jq 'length' sonar-results/issues.json)
          HOTSPOTS=$(jq 'length' sonar-results/hotspots.json)

          # Tab-separated list: severity, type, file:line, rule, message
          jq -r '.[] | [
              (.severity // "-"),
              (.type // "-"),
              ((.component | sub("^[^:]+:"; "")) + ":" + ((.line // 0) | tostring)),
              .rule,
              .message
            ] | @tsv' sonar-results/issues.json \
            | sort -t$'\t' -k1,1 > sonar-results/issues.tsv
          jq -r '.[] | [
              .vulnerabilityProbability,
              ((.component | sub("^[^:]+:"; "")) + ":" + ((.line // 0) | tostring)),
              .message
            ] | @tsv' sonar-results/hotspots.json > sonar-results/hotspots.tsv

          # Job log
          echo "================ SonarQube results ================"
          echo "Quality gate:      $GATE"
          echo "Open issues:       $ISSUES"
          echo "Security hotspots: $HOTSPOTS"
          echo
          jq -r '.component.measures[] | "\(.metric): \(.value)"' sonar-results/measures.json
          echo
          echo "::group::Issues by type/severity"
          jq -r 'group_by(.type, .severity)[] | "\(.[0].type) \(.[0].severity): \(length)"' sonar-results/issues.json
          echo "::endgroup::"
          echo "::group::All issues (severity, type, location, rule, message)"
          cat sonar-results/issues.tsv
          echo "::endgroup::"
          echo "::group::Security hotspots (probability, location, message)"
          cat sonar-results/hotspots.tsv
          echo "::endgroup::"

          # Run summary page (top 100 issues to stay within GitHub's size limit)
          {
            echo "## SonarQube results"
            echo
            echo "| Quality gate | Open issues | Security hotspots |"
            echo "|---|---|---|"
            echo "| **$GATE** | $ISSUES | $HOTSPOTS |"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            jq -r '.component.measures[] | "| \(.metric) | \(.value) |"' sonar-results/measures.json
            echo
            echo "### Issues (first 100, full list in the sonarqube-results artifact)"
            echo
            echo "| Severity | Type | Location | Message |"
            echo "|---|---|---|---|"
            head -100 sonar-results/issues.tsv \
              | awk -F'\t' '{ gsub(/\|/, "\\|", $5); printf "| %s | %s | `%s` | %s |\n", $1, $2, $3, $5 }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SonarQube results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-results
          path: sonar-results/
          if-no-files-found: ignore

  # SAST: security bugs in the source code
  semgrep:
    name: Semgrep (code security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'development' }}

      - name: Run Semgrep
        run: |
          mkdir -p semgrep-results
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan \
              --config p/java \
              --config p/owasp-top-ten \
              --config p/secrets \
              --metrics=off \
              --sarif-output=semgrep-results/semgrep.sarif \
              --json-output=semgrep-results/semgrep.json

      - name: Summarize findings
        if: always()
        run: |
          f=semgrep-results/semgrep.json
          [ -f "$f" ] || exit 0
          {
            echo "## Semgrep (code security)"
            echo
            echo "**Findings:** $(jq '.results | length' $f)"
            echo
            echo "| Severity | Count |"
            echo "|---|---|"
            jq -r '.results | group_by(.extra.severity)[] | "| \(.[0].extra.severity) | \(length) |"' $f
            echo
            echo "| Severity | Location | Rule |"
            echo "|---|---|---|"
            jq -r '.results[:100][] | "| \(.extra.severity) | `\(.path):\(.start.line)` | \(.check_id | split(".") | last) |"' $f
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results/
          if-no-files-found: ignore

      - name: Publish to GitHub Security tab
        if: always()
        continue-on-error: true   # needs code scanning enabled (GHAS on private repos)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results/semgrep.sarif
          category: semgrep

  # SCA: known vulnerabilities (CVEs) in Maven dependencies
  trivy:
    name: Trivy (dependency vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'development' }}

      - name: Run Trivy
        run: |
          mkdir -p trivy-results ~/.cache/trivy
          trivy() {
            docker run --rm -v "$PWD:/src" -w /src -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:latest fs --scanners vuln --severity CRITICAL,HIGH,MEDIUM "$@" .
          }
          # Readable table in the log, then machine formats for summary/Security tab
          trivy --format table
          trivy --format json  --output trivy-results/trivy.json
          trivy --format sarif --output trivy-results/trivy.sarif

      - name: Summarize findings
        if: always()
        run: |
          f=trivy-results/trivy.json
          [ -f "$f" ] || exit 0
          {
            echo "## Trivy (dependency vulnerabilities)"
            echo
            echo "| Severity | Count |"
            echo "|---|---|"
            jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity)[] | "| \(.[0].Severity) | \(length) |"' $f
            echo
            echo "| Severity | Package | Installed | Fixed in | CVE | File |"
            echo "|---|---|---|---|---|---|"
            jq -r '[.Results[]? as $r | $r.Vulnerabilities[]? | . + {Target: $r.Target}]
                   | sort_by(.Severity) | .[:100][]
                   | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \(.VulnerabilityID) | `\(.Target)` |"' $f
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results/
          if-no-files-found: ignore

      - name: Publish to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results/trivy.sarif
          category: trivy

  # IaC: Dockerfiles, docker-compose, Terraform misconfigurations
  kics:
    name: KICS (Docker / Terraform config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'development' }}

      - name: Run KICS
        run: |
          mkdir -p kics-results
          docker run --rm -v "$PWD:/src" checkmarx/kics:latest scan \
            --path /src \
            --output-path /src/kics-results \
            --report-formats json,sarif \
            --ignore-on-exit results \
            --no-progress

      - name: Summarize findings
        if: always()
        run: |
          f=kics-results/results.json
          [ -f "$f" ] || exit 0
          {
            echo "## KICS (Docker / Terraform config)"
            echo
            echo "| Severity | Count |"
            echo "|---|---|"
            jq -r '.severity_counters | to_entries[] | select(.value > 0) | "| \(.key) | \(.value) |"' $f
            echo
            echo "| Severity | Issue | Location |"
            echo "|---|---|---|"
            jq -r '[.queries[] as $q | $q.files[] | {s: $q.severity, n: $q.query_name, l: "\(.file_name):\(.line)"}]
                   | .[:100][] | "| \(.s) | \(.n) | `\(.l | sub("^/src/"; ""))` |"' $f
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kics-results
          path: kics-results/
          if-no-files-found: ignore

      - name: Publish to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kics-results/results.sarif
          category: kics
