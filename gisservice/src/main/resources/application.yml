spring:
  application:
    name: gisservice

  config:
    import: optional:file:.env[.properties]

  datasource:
    name: postgresql
    url: jdbc:postgresql://${GIS_DB_IP:localhost}:${GIS_DB_PORT:5432}/opensourceworkforcemanagement?currentSchema=oswfm,public&charSet=UTF-8
    username: ${DATABASE_USERNAME:oswfm}
    password: ${DATABASE_PASSWORD:oswfm}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: gisservice_migration_history

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}

oswfm:
  group-location-buffer:
    flush-on-timeout: ${GROUP_LOCATION_FLUSH_ON_TIMEOUT:true}
    flush-timeout-ms: ${GROUP_LOCATION_FLUSH_TIMEOUT_MS:30000}
    reset-after-publish: ${GROUP_LOCATION_RESET_AFTER_PUBLISH:true}
    sweep-interval-ms: ${GROUP_LOCATION_SWEEP_INTERVAL_MS:5000}
    membership-cache-ttl-ms: ${GROUP_LOCATION_MEMBERSHIP_CACHE_TTL_MS:30000}

server:
  port: ${SERVER_PORT:1116}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.oswfm.gisservice: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/gisservice.log}
    max-size: ${LOG_MAX_SIZE:50MB}
    max-history: ${LOG_MAX_HISTORY:30}
    total-size-cap: ${LOG_TOTAL_SIZE:1GB}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_PATH:logs/gisservice}-%d{yyyy-MM-dd}-%i.log
      max-file-size: ${LOG_MAX_SIZE:50MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE:1GB}
